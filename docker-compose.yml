services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prospek
      POSTGRES_DB: prospek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Jalankan npm run setup}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospek -d prospek"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
